[project]
name = "traceable"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["mcp>=1.12,<2", "httpx>=0.27,<1", "tomli-w>=1,<2", "pypdfium2>=4.30,<5", "pillow>=10"]

[dependency-groups]
dev = ["pytest>=8", "reportlab>=4", "pyyaml>=6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["traceable"]

[tool.pytest.ini_options]
testpaths = ["../tests"]
