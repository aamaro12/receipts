    - 'cent'
- id: t4
  must_say:
    - 'fiscal|financial year'
    - '30 June|June 30'
  allow:
    - 26.9861%               # the year to 30 June 2023: 5,547 / 20,555
    - 29.60679%              # the year to 30 June 2024
- id: l1
  expect:
    - 18,420 kg              # bill of lading
